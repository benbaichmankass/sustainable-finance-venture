name: Publish dashboard to GitHub Pages

# Inert until Pages is enabled: Settings -> Pages -> Source: GitHub Actions.
# Builds the PUBLIC tier only. The private overlay lives in private/, which is
# gitignored and therefore never present in CI - the --public flag is a second
# line of defence, not the first. See docs/publishing.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fail if any private file was committed
        run: |
          set -e
          if git ls-files private/ | grep -vE '^private/(README\.md|.*\.example\.csv)$'; then
            echo "::error::A file under private/ is tracked by git. See docs/publishing.md."
            exit 1
          fi
          if [ -f dashboard/data.private.js ]; then
            echo "::error::dashboard/data.private.js is committed. It must stay gitignored."
            exit 1
          fi

      - name: Build public dashboard data
        run: python3 dashboard/build.py --public

      - name: Fail if private columns leaked into the build
        run: |
          set -e
          if grep -qE '"(Private_Notes|Contact_Person|Contact_Status|Application_Status)"' dashboard/data.js; then
            echo "::error::Private columns present in dashboard/data.js."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
