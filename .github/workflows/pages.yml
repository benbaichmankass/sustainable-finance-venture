name: Publish dashboard to GitHub Pages

# Inert until Pages is enabled: Settings -> Pages -> Source: GitHub Actions.
# Builds the PUBLIC tier only. The private overlay lives in private/, which is
# gitignored and therefore never present in CI - the --public flag is a second
# line of defence, not the first. See docs/publishing.md.

on:
  push:
    branches: [main]
  schedule:
    # Daily macro refresh. Off-the-hour minute deliberately: GitHub's scheduler
    # is congested at :00 and drops or delays runs queued there.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write   # needed to commit the refreshed macro snapshot
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fail if any private file was committed
        run: |
          set -e
          if git ls-files private/ | grep -vE '^private/(README\.md|.*\.example\.csv)$'; then
            echo "::error::A file under private/ is tracked by git. See docs/publishing.md."
            exit 1
          fi
          if [ -f dashboard/data.private.js ]; then
            echo "::error::dashboard/data.private.js is committed. It must stay gitignored."
            exit 1
          fi

      # Only on scheduled/manual runs. A push build must not commit back to main -
      # that would create a second commit for every push and, since GITHUB_TOKEN
      # pushes don't retrigger workflows, a confusing half-deployed state.
      # The fetcher never exits non-zero, so a flaky upstream API cannot block
      # the deploy; it keeps the last good value and marks the row stale.
      - name: Refresh macro snapshot
        if: github.event_name != 'push'
        run: python3 dashboard/fetch_macro.py

      - name: Commit refreshed snapshot
        if: github.event_name != 'push'
        run: |
          set -e
          if git diff --quiet -- data/macro-snapshot.csv; then
            echo "No change to the snapshot - nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/macro-snapshot.csv
          git commit -m "macro: refresh snapshot ($(date -u +%Y-%m-%d))"
          git push

      - name: Build public dashboard data
        run: python3 dashboard/build.py --public

      # Match the JSON key form, with the colon. A bare column name also appears
      # in the prose of docs/publishing.md and the publish-check skill, both of
      # which are baked into data.js as document text - so a loose pattern
      # matches the policy that describes the check, not a real leak.
      - name: Fail if private columns leaked into the build
        run: |
          set -e
          if grep -qE '"(Private_Notes|Contact_Person|Contact_Status|Application_Status)":' dashboard/data.js; then
            echo "::error::Private columns present in dashboard/data.js."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
